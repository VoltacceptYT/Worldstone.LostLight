name: Build ROM
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.24.0
    steps:
      - uses: actions/checkout@v4
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: worldstone
          path: build/*.nds
